<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>My To-Do List</h1>
            <p>One small step at a time.</p>
        </header>

        <form id="todo-form">
            <input
                type="text"
                id="todo-input"
                placeholder="What do you need to do?"
                autocomplete="off"
                aria-label="New task"
            >
            <button type="submit">Add Task</button>
        </form>

        <div class="task-info">
            <span id="task-count">0 tasks left</span>
            <button id="clear-completed" type="button" class="text-button">
                Clear completed
            </button>
        </div>

        <ul id="todo-list" aria-live="polite">
            <!-- Tasks are added here by JavaScript -->
        </ul>

        <p id="empty-message">Your list is empty. Add your first task!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
